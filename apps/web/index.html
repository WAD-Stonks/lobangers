<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Good food, better prices, all around Singapore. Discover food deals with LOBANGERS." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Lobangers</title>
    <meta name="theme-color" content="#fcfbf8" />
    <!-- Link previews. og:image must be absolute; update it if the production domain changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lobangers" />
    <meta property="og:title" content="Lobangers" />
    <meta property="og:description" content="Good food, better prices, all around Singapore." />
    <meta property="og:image" content="https://broke-oclock-web.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lobangers logo with the line Bang for your buck." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Apply the saved or system theme before first paint; src/lib/theme.ts owns it afterwards. -->
    <script>
      (() => {
        let theme = null
        try { theme = localStorage.getItem('lobangers.theme') } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        const root = document.documentElement
        root.dataset.theme = theme
        // App.vue keeps this in sync after mount; adding it now stops a light flash on app routes.
        const appRoute = !/^\/(about\/?)?$/.test(location.pathname)
        if (appRoute) root.classList.add('app-palette')
        // Tint the mobile toolbar to match; the landing page always stays light.
        const themeColor = document.querySelector('meta[name="theme-color"]')
        if (themeColor && appRoute && theme === 'dark') themeColor.content = '#141412'
      })()
    </script>
    <!-- Fredoka for titles and pills, Plus Jakarta Sans for body text; main.css falls back to system fonts offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
