packages:
  - apps/*
  - packages/*

# Keep undeclared dependencies hidden; do not mask them with hoisting.
nodeLinker: isolated
hoist: false
packageManagerStrictVersion: true

# No automatic project or dependency lifecycle scripts. Generate Prisma explicitly.
ignoreScripts: true
sideEffectsCache: false

overrides:
  effect: 3.21.0

auditConfig:
  ignoreGhsas:
    # Prisma 6's trusted CLI configuration depends on deepmerge-ts 7. Its advisory
    # requires cyclic JavaScript objects, which request JSON cannot contain.
    # Revisit when upgrading Prisma; do not override its dependency across a major.
    - GHSA-ggr8-5vv4-36mx
