name: Hourly deal ingestion
on:
  schedule:
    # GitHub schedules may be delayed or dropped; off-peak minute reduces contention.
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hourly-deal-ingestion
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke the authenticated bounded ingestion POST
        env:
          INGESTION_API_URL: ${{ secrets.INGESTION_API_URL }}
          INGESTION_CRON_SECRET: ${{ secrets.INGESTION_CRON_SECRET }}
        shell: python
        run: |
          import json, os, re, sys, urllib.error, urllib.parse, urllib.request
          origin = os.environ.get('INGESTION_API_URL', '')
          secret = os.environ.get('INGESTION_CRON_SECRET', '')
          if not origin or not secret:
              print('Ingestion not configured; skipped.')
              sys.exit(0)
          target = urllib.parse.urlsplit(origin)
          if (target.scheme != 'https' or not target.hostname or target.username or target.password
              or target.path not in ('', '/') or target.query or target.fragment
              or not re.fullmatch(r'[A-Za-z0-9_-]{32,256}', secret)):
              sys.exit('Invalid ingestion configuration.')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          request = urllib.request.Request(origin.rstrip('/') + '/api/ingestion/scheduled-runs',
              data=b'', method='POST', headers={'Authorization': 'Bearer ' + secret})
          try:
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=180) as response:
                  if response.status != 200:
                      sys.exit('Ingestion request failed.')
                  result = json.loads(response.read(65536))
                  if result.get('status') != 'SUCCEEDED':
                      sys.exit('Ingestion incomplete; inspect application run history before retrying.')
                  print('Ingestion invocation completed. Inspect application run history for per-source results.')
          except Exception:
              sys.exit('Ingestion request failed; inspect application run history before retrying.')
